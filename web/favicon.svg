<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7ad"/><stop offset=".42" stop-color="#f3b33d"/><stop offset="1" stop-color="#9c5d16"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d6878"/><stop offset=".45" stop-color="#2e3642"/><stop offset="1" stop-color="#151920"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".35" r=".75">
      <stop offset="0" stop-color="#2f3947"/><stop offset=".7" stop-color="#121720"/><stop offset="1" stop-color="#090b0f"/>
