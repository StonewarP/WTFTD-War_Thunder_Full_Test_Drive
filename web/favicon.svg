    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6dc"/><stop offset=".5" stop-color="#f6bb48"/><stop offset="1" stop-color="#b9731b"/>
    </linearGradient>
    <radialGradient id="flame" cx=".5" cy=".2" r=".8">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".35" stop-color="#ffb13b"/><stop offset="1" stop-color="#ff4d1f" stop-opacity="0"/>
