<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WTFTD — War Thunder Full Test Drive</title>
  <link rel="icon" href="favicon.ico?v=3" sizes="any">
  <link rel="icon" href="logo.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo-192.png?v=3">
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <meta name="theme-color" content="#0a0d11">
  <link rel="stylesheet" href="app.css">
  <script>
    // apply the theme before first paint (no dark/light flash)
    (function () {
      var t = 'dark';
      try { t = JSON.parse(localStorage.getItem('wtftd.theme')) || 'dark'; } catch (e) {}
      if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>

<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="logo.svg?v=3" alt="">
    <div class="brand-text"><b data-i18n="app.title">WTFTD</b><span data-i18n="app.tagline"></span></div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-view="vehicles" role="tab"><span data-i18n="nav.vehicles"></span></button>
    <button class="tab" data-view="setups" role="tab"><span data-i18n="nav.myVehicles"></span><span class="tab-count" id="setupCount"></span></button>
    <button class="tab" data-view="maps" role="tab"><span data-i18n="nav.maps"></span></button>
    <button class="tab" data-view="mymaps" role="tab"><span data-i18n="nav.myMaps"></span><span class="tab-count" id="myMapCount"></span></button>
    <button class="tab" data-view="missions" role="tab"><span data-i18n="nav.missions"></span><span class="tab-count" id="missionCount"></span></button>
    <button class="tab" data-view="weapons" role="tab"><span data-i18n="nav.weapons"></span></button>
  </nav>
  <label class="search">
    <svg class="ic"><use href="#i-search"/></svg>
    <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="search.placeholder">
    <kbd>Ctrl K</kbd>
  </label>
  <div class="top-actions">
    <div class="status" id="status"></div>
    <button class="btn btn-ghost" id="btnLaunchTop"><svg class="ic"><use href="#i-play"/></svg><span data-i18n="action.launch"></span></button>
    <button class="icon-btn heart" id="btnSupport" data-i18n-title="app.support"><svg class="ic"><use href="#i-heart"/></svg></button>
    <button class="icon-btn" id="btnTheme" data-i18n-title="theme.toggle"><svg class="ic"><use href="#i-sun"/></svg></button>
    <button class="icon-btn" id="btnSettings" data-i18n-title="settings.title"><svg class="ic"><use href="#i-gear"/></svg></button>
  </div>
</header>

<div class="update-banner hidden" id="updateBanner"></div>
<main class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-section">
      <div class="cats" id="cats"></div>
    </div>
    <div class="side-section">
      <div class="side-title" data-i18n="filters.nations"></div>
      <div class="nations" id="nations"></div>
    </div>
    <div class="side-section">
      <div class="side-title" data-i18n="filters.rank"></div>
      <div class="ranks" id="ranks"></div>
    </div>
    <div class="side-section">
      <div class="side-title row-between"><span data-i18n="filters.br"></span>
        <div class="seg seg-xs" id="brMode">
          <button data-mode="0" data-i18n="filters.mode.ab"></button><button data-mode="1" data-i18n="filters.mode.rb"></button><button data-mode="2" data-i18n="filters.mode.sb"></button>
        </div>
      </div>
      <div class="range" id="brRange">
        <div class="range-track"><div class="range-fill" id="brFill"></div></div>
        <input type="range" id="brMin" min="1" max="14.3" step="0.1">
        <input type="range" id="brMax" min="1" max="14.3" step="0.1">
      </div>
      <div class="range-labels"><span id="brMinLabel"></span><span id="brMaxLabel"></span></div>
    </div>
    <div class="side-section hidden" id="roleSection">
      <div class="side-title" data-i18n="filters.type"></div>
      <div class="roles" id="roles"></div>
    </div>
    <div class="side-section">
      <div class="side-title" data-i18n="filters.stats"></div>
      <div id="statFilters"></div>
    </div>
    <div class="side-section">
      <div class="side-title" data-i18n="filters.options"></div>
      <label class="switch"><input type="checkbox" id="optFav"><span class="sw"></span><span data-i18n="filters.favorites"></span></label>
      <label class="switch"><input type="checkbox" id="optPrem"><span class="sw"></span><span data-i18n="filters.premium"></span></label>
      <label class="switch" data-i18n-title="filters.hiddenHint"><input type="checkbox" id="optHidden"><span class="sw"></span><span data-i18n="filters.hidden"></span></label>
    </div>
    <div class="side-section side-foot">
      <button class="btn btn-ghost btn-block" id="btnReset"><svg class="ic"><use href="#i-refresh"/></svg><span data-i18n="filters.reset"></span></button>
    </div>
  </aside>

  <section class="content">
    <div class="view" id="view-vehicles">
      <div class="results-bar">
        <div class="results-count" id="resultsCount"></div>
        <div class="row gap">
        <div class="seg" id="viewMode"><button data-v="tree"><svg class="ic-sm"><use href="#i-tree"/></svg><span data-i18n="view.tree"></span></button><button data-v="grid"><svg class="ic-sm"><use href="#i-all"/></svg><span data-i18n="view.grid"></span></button></div>
        <label class="select-inline" id="sortWrap"><span data-i18n="filters.sort"></span>
          <select id="sort">
            <option value="br" data-i18n="sort.br"></option>
            <option value="rank" data-i18n="sort.rank"></option>
            <option value="name" data-i18n="sort.name"></option>
            <option value="nation" data-i18n="sort.nation"></option>
            <option value="rarity" data-i18n="sort.rarity"></option>
          </select>
        </label>
        </div>
      </div>
      <div class="tree hidden" id="tree"></div>
      <div class="grid" id="grid"></div>
      <div class="empty hidden" id="gridEmpty"><svg class="ic-xl"><use href="#i-search"/></svg><p data-i18n="results.empty"></p></div>
      <div id="sentinel"></div>
    </div>

    <div class="view hidden" id="view-maps">
      <div class="page-head"><div><h2 data-i18n="maps.title"></h2><p class="muted" data-i18n="maps.hint"></p></div></div>
      <div class="mp-bar">
        <div class="seg" id="mapKinds"></div>
        <label class="search mp-search"><svg class="ic"><use href="#i-search"/></svg><input id="mapSearch" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="maps.search"></label>
        <span class="muted" id="mapCount"></span>
      </div>
      <div class="mp-grid" id="mapGrid"></div>
    </div>

    <div class="view hidden" id="view-weapons">
      <div class="page-head"><div><h2 data-i18n="arm.title"></h2><p class="muted" data-i18n="arm.hint"></p></div></div>
      <div class="ar-cats" id="arCats"></div>
      <div class="ar-guide" id="arGuide"></div>
      <div class="ar-bar">
        <label class="search ar-search"><svg class="ic"><use href="#i-search"/></svg><input id="arSearch" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="arm.search"></label>
        <select id="arNat"></select>
        <div class="ar-chips" id="arGuid"></div>
        <span class="muted ar-count" id="arCount"></span>
      </div>
      <div class="ar-chips ar-uses" id="arUses"></div>
      <div class="ar-scroll" id="arTable"></div>
      <div class="compare-tray ar-tray hidden" id="arTray"></div>
    </div>

    <div class="view hidden" id="view-mymaps">
      <div class="page-head"><div><h2 data-i18n="mymaps.title"></h2><p class="muted" data-i18n="mymaps.hint"></p></div>
        <button class="btn" id="btnImportMaps"><svg class="ic-sm"><use href="#i-share"/></svg><span data-i18n="share.import"></span></button></div>
      <div class="list" id="myMapList"></div>
    </div>

    <div class="view hidden" id="view-setups">
      <div class="page-head"><div><h2 data-i18n="setups.title"></h2><p class="muted" data-i18n="share.setupsHint"></p></div>
        <button class="btn" id="btnImport"><svg class="ic-sm"><use href="#i-share"/></svg><span data-i18n="share.import"></span></button></div>
      <div class="list" id="setupList"></div>
    </div>

    <div class="view hidden" id="view-missions">
      <div class="page-head">
        <div><h2 data-i18n="missions.title"></h2><p class="muted" data-i18n="missions.hint"></p></div>
        <div class="row gap"><button class="btn" id="btnImportMissions"><svg class="ic-sm"><use href="#i-share"/></svg><span data-i18n="share.import"></span></button>
        <button class="btn btn-ghost" id="btnOpenFolder"><svg class="ic"><use href="#i-folder"/></svg><span data-i18n="action.openFolder"></span></button></div>
      </div>
      <h3 class="list-head" data-i18n="missions.saved"></h3>
      <div class="list" id="comboList"></div>
      <h3 class="list-head" data-i18n="missions.created"></h3>
      <div class="list" id="missionList"></div>
    </div>
  </section>

  <div class="pickbar" id="pickbar"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="compare-tray hidden" id="compareTray"></div>
</main>

<div class="onboard hidden" id="onboard">
  <div class="onboard-card">
    <label class="onboard-lang"><svg class="ic-sm"><use href="#i-globe"/></svg><span data-i18n="settings.language"></span>
      <select id="onboardLang"></select></label>
    <img class="brand-logo big" src="logo.svg?v=3" alt="">
    <h2 data-i18n="onboard.title"></h2>
    <p class="muted" data-i18n="onboard.text"></p>
    <button class="btn btn-primary" id="btnOnboard"><svg class="ic"><use href="#i-refresh"/></svg><span data-i18n="onboard.button"></span></button>
    <div class="pbar hidden" id="onboardBar"><div class="pbar-track"><i></i></div><div class="pbar-text"><span></span><b></b></div></div>
    <pre class="log hidden" id="onboardLog"></pre>
  </div>
</div>

<dialog class="modal" id="dlgSettings">
  <form method="dialog" class="modal-inner">
    <div class="modal-head"><h3 data-i18n="settings.title"></h3><button class="icon-btn" value="close"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="modal-body">
      <div class="field">
        <label for="setLang" data-i18n="settings.language"></label>
        <select id="setLang"></select>
        <small class="muted" data-i18n="settings.languageHint"></small>
      </div>
      <div class="field">
        <label for="setTheme" data-i18n="theme.label"></label>
        <select id="setTheme"><option value="dark" data-i18n="theme.dark"></option><option value="light" data-i18n="theme.light"></option><option value="system" data-i18n="theme.system"></option></select>
      </div>
      <div class="field">
        <label for="setGameDir" data-i18n="settings.gameDir"></label>
        <input id="setGameDir" type="text" spellcheck="false" placeholder="D:\SteamLibrary\steamapps\common\War Thunder">
        <small class="muted" id="setGameDirHint"></small>
      </div>
      <div class="field">
        <label for="setOodle" data-i18n="settings.oodle"></label>
        <input id="setOodle" type="text" spellcheck="false" placeholder="…\oo2core_9_win64.dll">
        <small class="muted"><span data-i18n="settings.oodleHint"></span> <span id="setOodleFound"></span></small>
      </div>
      <div class="field">
        <label data-i18n="settings.data"></label>
        <small class="muted" data-i18n="settings.dataHint"></small>
        <label class="switch"><input type="checkbox" id="setAutoUpdate"><span class="sw"></span><span data-i18n="settings.autoUpdate"></span></label>
        <div class="row gap"><button type="button" class="btn btn-ghost" id="btnUpdate"><svg class="ic"><use href="#i-refresh"/></svg><span data-i18n="settings.update"></span></button><small class="muted" id="dataVersion"></small></div>
        <pre class="log hidden" id="updateLog"></pre>
      </div>
      <div class="field">
        <label data-i18n="settings.cdk"></label>
        <label class="switch"><input type="checkbox" id="setCdk"><span class="sw"></span><span data-i18n="settings.cdkEnable"></span></label>
        <small class="muted" data-i18n="settings.cdkHint"></small>
        <div class="hosts" id="setHosts"></div>
        <small class="muted" data-i18n="settings.hostsHint"></small>
        <label class="host-row"><span data-i18n="settings.airMethod"></span>
          <select id="setAirMethod"><option value="custom" data-i18n="settings.airMethod.custom"></option><option value="userVehicles" data-i18n="settings.airMethod.userVehicles"></option></select></label>
        <div class="row gap"><button type="button" class="btn btn-ghost" id="btnCdkCleanup"><svg class="ic"><use href="#i-trash"/></svg><span data-i18n="settings.cdkCleanup"></span></button><small class="muted" id="cdkFiles"></small></div>
      </div>
      <div class="field howto">
        <label data-i18n="settings.howto"></label>
        <p class="muted" data-i18n="settings.howtoText"></p>
      </div>
      <div class="field">
        <label data-i18n="app.feedback"></label>
        <small class="muted" data-i18n="app.feedbackHint"></small>
        <div class="row gap"><button type="button" class="btn btn-ghost btn-sm" id="btnReportBug"><svg class="ic-sm"><use href="#i-x"/></svg><span data-i18n="app.reportBug"></span></button>
          <button type="button" class="btn btn-ghost btn-sm" id="btnSuggest"><svg class="ic-sm"><use href="#i-star"/></svg><span data-i18n="app.suggest"></span></button>
          <button type="button" class="btn btn-ghost btn-sm heart" id="btnSupport2" data-i18n-title="app.supportHint"><svg class="ic-sm"><use href="#i-heart"/></svg><span data-i18n="app.support"></span></button>
          <small class="muted" id="appVersion"></small></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" value="cancel" data-i18n="action.cancel"></button>
      <button type="button" class="btn btn-primary" id="btnSaveSettings" data-i18n="settings.save"></button>
    </div>
  </form>
</dialog>

<dialog class="modal modal-wide" id="dlgPreview">
  <form method="dialog" class="modal-inner">
    <div class="modal-head"><h3><span data-i18n="preview.title"></span> <code id="previewName"></code></h3>
      <div class="row gap"><button type="button" class="btn btn-ghost btn-sm" id="btnCopyPreview" data-i18n="action.copy"></button><button class="icon-btn" value="close"><svg class="ic"><use href="#i-x"/></svg></button></div></div>
    <pre class="code" id="previewText"></pre>
  </form>
</dialog>

<dialog class="modal modal-weapons" id="dlgWeapons">
  <div class="modal-inner">
    <div class="modal-head"><h3><svg class="ic"><use href="#i-ammo"/></svg><span data-i18n="wpick.title"></span></h3>
      <label class="search wp-search"><svg class="ic-sm"><use href="#i-search"/></svg><input type="search" id="wpSearch" data-i18n-ph="wpick.search" autocomplete="off"></label>
      <button class="icon-btn" id="wpClose"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="wp-cats lp-cats" id="wpCats"></div>
    <div class="wp-grid" id="wpGrid"></div>
    <div class="wp-foot"><div class="wp-chosen" id="wpChosen"></div><span class="muted" id="wpCount"></span>
      <button class="btn btn-ghost btn-sm" id="wpClear" data-i18n="wpick.clear"></button><button class="btn btn-primary btn-sm" id="wpDone" data-i18n="editor.done"></button></div>
  </div>
</dialog>

<dialog class="modal" id="dlgMission">
  <div class="modal-inner">
    <div class="modal-head"><h3><svg class="ic"><use href="#i-gear"/></svg><span data-i18n="mission.title"></span></h3>
      <button class="icon-btn" onclick="this.closest('dialog').close()"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="modal-body" id="missionDlgBody" style="padding-bottom:18px"></div>
  </div>
</dialog>

<dialog class="modal modal-map" id="dlgMap">
  <div class="modal-inner">
    <div class="modal-head"><h3><svg class="ic"><use href="#i-map"/></svg><span id="mapDlgName"></span></h3>
      <button class="icon-btn" onclick="this.closest('dialog').close()"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="modal-body" id="mapDlgBody"></div>
  </div>
</dialog>

<dialog class="modal" id="dlgShare">
  <div class="modal-inner">
    <div class="modal-head"><h3><svg class="ic"><use href="#i-share"/></svg><span data-i18n="share.title"></span></h3>
      <button class="icon-btn" onclick="this.closest('dialog').close()"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="modal-body share-body">
      <b id="shareWhat"></b>
      <p class="muted" data-i18n="share.text"></p>
      <textarea id="shareCode" readonly rows="5" spellcheck="false"></textarea>
      <div class="row gap"><button class="btn btn-primary" id="shareCopy"><svg class="ic-sm"><use href="#i-check"/></svg><span data-i18n="share.copy"></span></button>
        <button class="btn btn-ghost" id="shareFile"><svg class="ic-sm"><use href="#i-save"/></svg><span data-i18n="share.file"></span></button></div>
    </div>
  </div>
</dialog>

<dialog class="modal" id="dlgImport">
  <div class="modal-inner">
    <div class="modal-head"><h3><svg class="ic"><use href="#i-share"/></svg><span data-i18n="share.importTitle"></span></h3>
      <button class="icon-btn" onclick="this.closest('dialog').close()"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="modal-body share-body">
      <p class="muted" data-i18n="share.importText"></p>
      <textarea id="importCode" rows="5" spellcheck="false" placeholder="WTFTD1.…"></textarea>
      <div class="row gap"><button class="btn btn-primary" id="importGo"><svg class="ic-sm"><use href="#i-check"/></svg><span data-i18n="share.import"></span></button>
        <label class="btn btn-ghost"><svg class="ic-sm"><use href="#i-folder"/></svg><span data-i18n="share.openFile"></span><input type="file" id="importFile" accept=".wtftd,.json" hidden></label></div>
    </div>
  </div>
</dialog>

<dialog class="modal modal-compare" id="dlgCompare">
  <div class="modal-inner">
    <div class="modal-head"><h3><svg class="ic"><use href="#i-sliders"/></svg><span data-i18n="compare.title"></span></h3>
      <button class="icon-btn" onclick="this.closest('dialog').close()"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="cmp-scroll" id="cmpTable"></div>
  </div>
</dialog>

<dialog class="modal modal-compare" id="dlgWcmp">
  <div class="modal-inner">
    <div class="modal-head"><h3><svg class="ic"><use href="#i-sliders"/></svg><span data-i18n="arm.compareTitle"></span></h3>
      <button class="icon-btn" onclick="this.closest('dialog').close()"><svg class="ic"><use href="#i-x"/></svg></button></div>
    <div class="cmp-scroll" id="wcmpTable"></div>
  </div>
</dialog>

<dialog class="modal" id="dlgPrompt">
  <form method="dialog" class="modal-inner">
    <div class="modal-head"><h3 id="promptTitle"></h3></div>
    <div class="modal-body"><input id="promptInput" type="text" spellcheck="false"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" value="cancel" data-i18n="action.cancel"></button>
      <button class="btn btn-primary" value="ok" id="promptOk" data-i18n="action.save"></button>
    </div>
  </form>
</dialog>

<dialog class="modal modal-editor" id="dlgEditor">
  <div class="modal-inner">
    <div class="modal-head">
      <h3><svg class="ic"><use href="#i-map"/></svg><span data-i18n="editor.title"></span></h3>
      <div class="row gap"><span class="muted" id="edChanges"></span><button class="btn btn-primary btn-sm" id="edDone" data-i18n="editor.done"></button></div>
    </div>
    <div class="ed-body">
      <div class="ed-map">
        <div class="ed-tools" id="edTools">
          <button class="btn btn-sm" data-edmode="select"><span data-i18n="editor.select"></span></button>
          <button class="btn btn-sm" data-edmode="add" data-block="tankModels"><svg class="ic-sm"><use href="#i-ground"/></svg><span data-i18n="editor.addGround"></span></button>
          <button class="btn btn-sm" data-edmode="add" data-block="armada"><svg class="ic-sm"><use href="#i-air"/></svg><span data-i18n="editor.addAir"></span></button>
          <button class="btn btn-sm" data-edmode="add" data-block="ships"><svg class="ic-sm"><use href="#i-ship"/></svg><span data-i18n="editor.addShip"></span></button>
          <span class="seg ed-addside"><button data-edside="enemy"><i class="dot enemy"></i><span data-i18n="editor.enemy"></span></button><button data-edside="ally"><i class="dot ally"></i><span data-i18n="editor.ally"></span></button></span>
          <span class="ed-sep"></span>
          <button class="btn btn-ghost btn-sm" data-edact="fit" data-i18n="editor.fit"></button>
          <button class="btn btn-ghost btn-sm hidden" id="edFitMap" data-edact="fitMap" data-i18n="editor.fitMap"></button>
          <button class="btn btn-ghost btn-sm" data-edact="reset"><svg class="ic-sm"><use href="#i-refresh"/></svg><span data-i18n="editor.reset"></span></button>
        </div>
        <canvas id="edCanvas"></canvas>
        <div class="ed-hint" id="edHint"></div>
        <div class="ed-maphint hidden" id="edMapHint"><svg class="ic-sm"><use href="#i-map"/></svg><span data-i18n="editor.noMap"></span></div>
        <div class="ed-legend"><span><i class="dot player"></i><span data-i18n="editor.you"></span></span><span><i class="dot enemy"></i><span data-i18n="editor.enemies"></span></span><span><i class="dot ally"></i><span data-i18n="editor.allies"></span></span><span><i class="dot other"></i><span data-i18n="editor.scenery"></span></span></div>
      </div>
      <div class="ed-panel" id="edPanel">
        <div id="edInspector"></div>
        <div class="opt-group-title" data-i18n="editor.units"></div>
        <div class="ed-list" id="edList"></div>
      </div>
    </div>
  </div>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="loadout.js"></script>
<script src="editor.js"></script>
<script src="stats.js"></script>
<script src="share.js"></script>
<script src="appinfo.js"></script>
<script src="compare.js"></script>
<script src="weapons.js"></script>
<script src="maps.js"></script>
<script src="library.js"></script>
</body>
</html>
