name: Build the apps

# Publishing a release builds WTFTD-<version>.exe (Windows) and WTFTD-<version>.zip (WTFTD.app, Apple silicon) from
# the tagged code on GitHub's servers and attaches them to the release with their SHA-256, so anyone
# can check that the download comes from this source code.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the apps to (e.g. v0.15.0-beta)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Version matches the tag
        shell: pwsh
        run: |
          $v = python -c "import wtftd; print(wtftd.__version__)"
          if ($env:TAG -notlike "v$v*") { throw "Tag $env:TAG does not match wtftd.__version__ $v" }
      - name: Reading the game's files works (compression.zstd)
        run: python -c "import compression.zstd"
      - name: Build WTFTD-<version>.exe
        shell: cmd
        run: build_exe.bat < NUL
      - name: Attach the exe and its SHA-256 to the release
        shell: pwsh
        run: |
          $v = python -c "import wtftd; print(wtftd.__version__)"
          $exe = "WTFTD-$v.exe"  # build_exe.bat's name (built from the tag: no branch in it)
          $hash = (Get-FileHash dist\$exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $exe" | Out-File -Encoding ascii dist\$exe.sha256
          gh release upload $env:TAG dist\$exe dist\$exe.sha256 --clobber
          # PowerShell gets the notes as an array of lines: join them back with line breaks, not spaces
          $body = (gh release view $env:TAG --json body -q .body) -join "`n"
          if ($body -notmatch "SHA-256\*\* of $([regex]::Escape($exe))") {
            $note = "`n`n**SHA-256** of $exe (built by GitHub Actions from this tag): ``$hash```nCheck it in PowerShell: ``Get-FileHash $exe``"
            gh release edit $env:TAG --notes "$body$note"
          }

  build-macos:
    needs: build  # one job at a time edits the release notes
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Reading the game's files works (compression.zstd)
        run: python -c "import compression.zstd"
      - name: Build WTFTD.app
        run: ./build_app.sh
      - name: Attach the app and its SHA-256 to the release
        run: |
          zip="WTFTD-$(python3 -c "import wtftd; print(wtftd.__version__)").zip"  # build_app.sh's name (tag: no branch)
          cd dist
          hash=$(shasum -a 256 "$zip" | cut -d' ' -f1)
          echo "$hash  $zip" > "$zip.sha256"
          gh release upload "$TAG" "$zip" "$zip.sha256" --clobber
          body=$(gh release view "$TAG" --json body -q .body)
          case "$body" in
            *"SHA-256** of $zip"*) ;;  # the notes may name the zip: look for this very line
            *) gh release edit "$TAG" --notes "$body

          **SHA-256** of $zip (built by GitHub Actions from this tag): \`$hash\`
          Check it in Terminal: \`shasum -a 256 $zip\`" ;;
          esac
